# Project-wide tooling configuration (the app itself is not an installable
# package - only mazegen/ is; see mazegen/pyproject.toml for that).

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    "\\.venv/",
    "mazegen/build/",
    "mazegen/dist/",
]
