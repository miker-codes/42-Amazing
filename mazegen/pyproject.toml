[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable grid maze generator and solver (hexadecimal wall encoding)."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mruiz-ra" }]

[tool.setuptools]
py-modules = ["mazegen"]
